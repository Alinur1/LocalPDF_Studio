id: com.localpdfstudio.app
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
base: org.electronjs.Electron2.BaseApp
base-version: '25.08'
command: localpdf-studio-wrapper
separate-locales: false
finish-args:
  - --share=ipc
  - --socket=x11
  - --socket=wayland
  - --device=dri
  - --share=network
  - --filesystem=home
  - --talk-name=org.freedesktop.notifications

modules:
  - name: nodejs
    buildsystem: simple
    sources:
      - type: archive
        url: https://nodejs.org/dist/latest-v24.x/node-v24.13.0-linux-x64.tar.xz
        sha256: e798599612f4bb71333a3397ab0d095fd62214e115aea45aa858a145fc72d67e
    build-commands:
      - cp -R * /app/

  - name: ghostscript
    buildsystem: autotools
    sources:
      - type: archive
        url: https://github.com/ArtifexSoftware/ghostpdl-downloads/releases/download/gs10060/ghostscript-10.06.0.tar.gz
        sha256: 5bd6da34794928cc7e616f288e32bd0be7f9a5ca2d3c206a0af2c19a4e3a318f

  - name: localpdf-studio
    buildsystem: simple
    build-options:
      env:
        ELECTRON_CACHE: /run/build/localpdf-studio/electron-cache
        electron_config_cache: /run/build/localpdf-studio/electron-cache
        NODE_OPTIONS: "--max-old-space-size=2048"
        npm_config_cache: /run/build/localpdf-studio/npm-cache
    sources:
      - type: dir
        path: .
      - type: file
        url: https://github.com/electron/electron/releases/download/v38.7.2/electron-v38.7.2-linux-x64.zip
        sha256: fe428cd212680e1d6df61fa67efc260b9221d089c7a14c9863f18bcbeace5628
        dest: electron-cache
    build-commands:
      - npm install
      - npx electron-builder --linux --dir
      
      - mkdir -p /app/main
      - cp -r build/linux-unpacked/* /app/main/
      
      - mkdir -p /app/main/resources/assets/backend_linux/compiled-ghostscript/bin
      - cp /app/bin/gs /app/main/resources/assets/backend_linux/compiled-ghostscript/bin/
      - mkdir -p /app/main/resources/assets/backend_linux/compiled-ghostscript/share
      - cp -rv /app/share/ghostscript /app/main/resources/assets/backend_linux/compiled-ghostscript/share/

      - install -Dm755 scripts/flatpak-wrapper.sh /app/bin/localpdf-studio-wrapper
      - install -Dm644 localpdf-studio.desktop /app/share/applications/com.localpdfstudio.app.desktop
      - install -Dm644 assets/icons/app_icon_linux.png /app/share/icons/hicolor/512x512/apps/com.localpdfstudio.app.png
      - install -Dm644 com.localpdfstudio.app.metainfo.xml /app/share/metainfo/com.localpdfstudio.app.metainfo.xml

    post-install:
      - sed -i 's|^Icon=.*|Icon=com.localpdfstudio.app|g' /app/share/applications/com.localpdfstudio.app.desktop
      - sed -i 's|^Exec=[^ ]*\(.*\)|Exec=localpdf-studio-wrapper\1|g' /app/share/applications/com.localpdfstudio.app.desktop