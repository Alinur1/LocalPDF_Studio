<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LocalPDF Studio - Image Editor</title>
    <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: file:; connect-src 'self' blob:;">

    <link rel="stylesheet" href="../../styles/main.css">
    <link rel="stylesheet" href="./editImages.css">
    <script type="module" src="../../utils/themeManager.js"></script>
</head>

<body>
    <div id="app">
        <div class="top-bar">
            <a href="../../index.html" class="top-btn" data-i18n="common.back-btn">← Back</a>
            <h1 class="tool-title" data-i18n="resizeImages.page-title">Image Editor</h1>
        </div>

        <main class="tool-container">
            <!-- File Selection -->
            <div class="file-selection-area" id="file-selection-area">
                <button id="select-images-btn" class="select-images-btn" data-i18n="common.btn-image-select">
                    📁 Click to Select Images or Drag & Drop
                </button>
                <!-- FIX: Hidden file input element was missing — JS called input.click() on a
                     dynamically created element, but having it in the DOM allows better
                     control and avoids popup blockers in some Electron versions. -->
                <input type="file" id="file-input"
                    accept="image/jpeg,image/png,image/bmp,image/tiff,image/gif,image/webp" multiple
                    style="display: none;" aria-hidden="true">
                <div id="selected-files-info" class="selected-files-info" style="display: none;">
                    <div style="flex-grow: 1;">
                        <p id="files-count" class="files-count"></p>
                        <p id="files-size" class="files-size"></p>
                    </div>
                    <button id="remove-files-btn" class="remove-btn" aria-label="Remove selected files">×</button>
                </div>
            </div>

            <!-- Main Layout -->
            <div class="resize-wrapper">
                <!-- Preview Panel -->
                <div class="preview-section" id="preview-section" style="display: none;">
                    <div class="preview-header">
                        <h3 data-i18n="resizeImages.preview-title">Preview</h3>
                        <div class="preview-tabs" role="tablist">
                            <button class="preview-tab active" data-tab="before" role="tab" aria-selected="true"
                                data-i18n="resizeImages.before">Before</button>
                            <button class="preview-tab" data-tab="after" role="tab" aria-selected="false"
                                data-i18n="resizeImages.after">After</button>
                            <button class="preview-tab" data-tab="comparison" role="tab" aria-selected="false"
                                data-i18n="resizeImages.comparison">Comparison</button>
                        </div>
                    </div>

                    <div class="preview-content">
                        <!-- Before -->
                        <div class="preview-tab-content active" id="preview-before" role="tabpanel">
                            <canvas id="canvas-before" class="preview-canvas"></canvas>
                        </div>

                        <!-- After -->
                        <div class="preview-tab-content" id="preview-after" role="tabpanel">
                            <canvas id="canvas-after" class="preview-canvas"></canvas>
                        </div>

                        <!-- Comparison (Slider) -->
                        <div class="preview-tab-content" id="preview-comparison" role="tabpanel">
                            <div class="comparison-slider">
                                <div class="comparison-img before">
                                    <canvas id="canvas-compare-before" class="preview-canvas"></canvas>
                                </div>
                                <div class="comparison-img after">
                                    <canvas id="canvas-compare-after" class="preview-canvas"></canvas>
                                </div>
                                <!-- FIX: Added aria-label for accessibility -->
                                <input type="range" class="comparison-range" min="0" max="100" value="50"
                                    aria-label="Comparison slider">
                            </div>
                        </div>
                    </div>

                    <div class="preview-info" aria-live="polite">
                        <div class="info-item">
                            <span data-i18n="resizeImages.original-size">Original:</span>
                            <span id="original-size">-</span>
                        </div>
                        <div class="info-item">
                            <span data-i18n="resizeImages.new-size">New:</span>
                            <span id="new-size">-</span>
                        </div>
                        <div class="info-item">
                            <span data-i18n="resizeImages.file-size">File Size:</span>
                            <span id="file-size-info">-</span>
                        </div>
                        <div class="info-item">
                            <span data-i18n="resizeImages.reduction">Reduction:</span>
                            <span id="reduction-info">-</span>
                        </div>
                    </div>
                </div>

                <!-- Options Panel -->
                <!-- FIX: Added id="options-panel" — JS references this ID in showResults() to hide it -->
                <div class="options-panel" id="options-panel">
                    <div class="images-list" id="images-list" style="display: none;">
                        <h4 data-i18n="resizeImages.images-list">Images</h4>
                        <div id="images-grid" class="images-grid"></div>
                    </div>

                    <!-- Accordion Container -->
                    <div class="options-accordion">

                        <!-- SECTION 1: Resize Mode -->
                        <div class="accordion-item">
                            <button class="accordion-header" aria-expanded="false" data-i18n="resizeImages.resize-mode">
                                📏 Resize Mode
                            </button>
                            <div class="accordion-content">
                                <div class="option-group">
                                    <div class="radio-group">
                                        <label>
                                            <input type="radio" name="resize-mode" value="fixed" checked>
                                            <span data-i18n="resizeImages.mode-fixed">Fixed Dimensions (px)</span>
                                        </label>
                                        <label>
                                            <input type="radio" name="resize-mode" value="percentage">
                                            <span data-i18n="resizeImages.mode-percentage">Percentage (%)</span>
                                        </label>
                                        <label>
                                            <input type="radio" name="resize-mode" value="fitcontain">
                                            <span data-i18n="resizeImages.mode-fitcontain">Fit & Contain</span>
                                        </label>
                                        <label>
                                            <input type="radio" name="resize-mode" value="cover">
                                            <span data-i18n="resizeImages.mode-cover">Cover (Crop)</span>
                                        </label>
                                    </div>
                                </div>

                                <!-- Width & Height -->
                                <div class="option-group">
                                    <label for="resize-width" data-i18n="resizeImages.width">Width</label>
                                    <div class="input-with-unit">
                                        <input type="number" id="resize-width" value="800" min="1" max="10000">
                                        <span class="unit" id="resize-width-unit">px</span>
                                    </div>
                                </div>

                                <div class="option-group">
                                    <label for="resize-height" data-i18n="resizeImages.height">Height</label>
                                    <div class="input-with-unit">
                                        <input type="number" id="resize-height" value="600" min="1" max="10000">
                                        <span class="unit" id="resize-height-unit">px</span>
                                    </div>
                                </div>

                                <!-- Aspect Ratio Lock -->
                                <div class="option-group">
                                    <label class="checkbox-label">
                                        <input type="checkbox" id="lock-aspect-ratio" checked>
                                        <span data-i18n="resizeImages.lock-aspect">🔒 Lock Aspect Ratio</span>
                                    </label>
                                </div>

                                <!-- Aspect Ratio Presets -->
                                <div class="option-group">
                                    <label data-i18n="resizeImages.aspect-ratio">Aspect Ratio</label>
                                    <div class="button-group">
                                        <button class="preset-btn active" data-ratio="16:9">16:9</button>
                                        <button class="preset-btn" data-ratio="4:3">4:3</button>
                                        <button class="preset-btn" data-ratio="1:1">1:1</button>
                                        <button class="preset-btn" data-ratio="3:2">3:2</button>
                                        <button class="preset-btn" data-ratio="9:16">9:16</button>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <!-- SECTION 2: Aspect Ratio Handling -->
                        <div class="accordion-item">
                            <button class="accordion-header" aria-expanded="false"
                                data-i18n="resizeImages.aspect-handling">
                                ⚙️ Aspect Ratio Handling
                            </button>
                            <div class="accordion-content">
                                <div class="option-group">
                                    <div class="radio-group">
                                        <label>
                                            <input type="radio" name="aspect-mode" value="stretch" checked>
                                            <span data-i18n="resizeImages.aspect-stretch">Stretch (Distort)</span>
                                        </label>
                                        <label>
                                            <input type="radio" name="aspect-mode" value="contain">
                                            <span data-i18n="resizeImages.aspect-contain">Contain (Padding)</span>
                                        </label>
                                        <label>
                                            <input type="radio" name="aspect-mode" value="cover">
                                            <span data-i18n="resizeImages.aspect-cover">Cover (Crop)</span>
                                        </label>
                                    </div>
                                </div>

                                <!-- Padding Color -->
                                <div class="option-group">
                                    <label for="padding-color" data-i18n="resizeImages.padding-color">Padding
                                        Color</label>
                                    <div class="color-input-group">
                                        <input type="color" id="padding-color" value="#ffffff">
                                        <input type="text" id="padding-color-hex" value="#ffffff" maxlength="7"
                                            aria-label="Hex color value">
                                    </div>
                                </div>
                            </div>
                        </div>

                        <!-- SECTION 3: Transformations -->
                        <div class="accordion-item">
                            <button class="accordion-header" aria-expanded="false"
                                data-i18n="resizeImages.transformations">
                                🔄 Transformations
                            </button>
                            <div class="accordion-content">
                                <div class="option-group">
                                    <label data-i18n="resizeImages.rotation">Rotation</label>
                                    <!-- FIX: Changed data-rotation to store delta degrees (relative turns),
                                         not absolute angles. applyRotation() adds the value to the
                                         current rotation, so buttons should be +90 increments.
                                         A "Reset" button is added for setting rotation back to 0. -->
                                    <div class="button-group">
                                        <button class="transform-btn" data-rotation="0"
                                            data-i18n="resizeImages.rotation-reset">Reset 0°</button>
                                        <button class="transform-btn" data-rotation="90">+90°</button>
                                        <button class="transform-btn" data-rotation="180">+180°</button>
                                        <button class="transform-btn" data-rotation="270">+270°</button>
                                    </div>
                                </div>

                                <div class="option-group">
                                    <label data-i18n="resizeImages.flip">Flip</label>
                                    <div class="button-group">
                                        <button class="flip-btn" data-flip="horizontal"
                                            data-i18n="resizeImages.flip-horizontal">↔️ Horizontal</button>
                                        <button class="flip-btn" data-flip="vertical"
                                            data-i18n="resizeImages.flip-vertical">↕️ Vertical</button>
                                    </div>
                                </div>

                                <!-- Crop Area -->
                                <div class="option-group">
                                    <label data-i18n="resizeImages.crop">Crop Before Resize</label>
                                    <div class="radio-group">
                                        <label>
                                            <input type="radio" name="crop-mode" value="none" checked>
                                            <span data-i18n="resizeImages.crop-none">No Crop</span>
                                        </label>
                                        <label>
                                            <input type="radio" name="crop-mode" value="preset">
                                            <span data-i18n="resizeImages.crop-preset">Preset</span>
                                        </label>
                                    </div>

                                    <div id="crop-presets" style="display: none; margin-top: 10px;">
                                        <div class="button-group">
                                            <button class="crop-preset-btn" data-ratio="16:9">16:9</button>
                                            <button class="crop-preset-btn" data-ratio="4:3">4:3</button>
                                            <button class="crop-preset-btn" data-ratio="1:1">1:1</button>
                                            <button class="crop-preset-btn" data-ratio="3:2">3:2</button>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <!-- SECTION 4: Image Enhancement -->
                        <div class="accordion-item">
                            <button class="accordion-header" aria-expanded="false" data-i18n="resizeImages.enhancement">
                                ✨ Image Enhancement
                            </button>
                            <div class="accordion-content">
                                <!-- Brightness -->
                                <div class="option-group">
                                    <label for="brightness-slider">
                                        <span data-i18n="resizeImages.brightness">Brightness:</span>
                                        <span id="brightness-value">100</span>%
                                    </label>
                                    <input type="range" id="brightness-slider" min="0" max="200" value="100">
                                </div>

                                <!-- Contrast -->
                                <div class="option-group">
                                    <label for="contrast-slider">
                                        <span data-i18n="resizeImages.contrast">Contrast:</span>
                                        <span id="contrast-value">100</span>%
                                    </label>
                                    <input type="range" id="contrast-slider" min="0" max="200" value="100">
                                </div>

                                <!-- Saturation -->
                                <div class="option-group">
                                    <label for="saturation-slider">
                                        <span data-i18n="resizeImages.saturation">Saturation:</span>
                                        <span id="saturation-value">100</span>%
                                    </label>
                                    <input type="range" id="saturation-slider" min="0" max="200" value="100">
                                </div>

                                <!-- Auto Enhance -->
                                <div class="option-group">
                                    <button id="auto-enhance-btn" class="secondary-btn"
                                        data-i18n="resizeImages.auto-enhance">
                                        🎯 Auto Enhance
                                    </button>
                                </div>

                                <!-- Filters -->
                                <div class="option-group">
                                    <label data-i18n="resizeImages.filters">Filters</label>
                                    <div class="button-group">
                                        <button class="filter-btn" data-filter="grayscale"
                                            data-i18n="resizeImages.filter-grayscale">Grayscale</button>
                                        <button class="filter-btn" data-filter="sepia"
                                            data-i18n="resizeImages.filter-sepia">Sepia</button>
                                        <button class="filter-btn" data-filter="blur"
                                            data-i18n="resizeImages.filter-blur">Blur</button>
                                        <button class="filter-btn" data-filter="sharpen"
                                            data-i18n="resizeImages.filter-sharpen">Sharpen</button>
                                    </div>
                                </div>

                                <!-- Hue Rotation -->
                                <div class="option-group">
                                    <label for="hue-slider">
                                        <span data-i18n="resizeImages.hue">Hue Rotation:</span>
                                        <span id="hue-value">0</span>°
                                    </label>
                                    <input type="range" id="hue-slider" min="0" max="360" value="0">
                                </div>
                            </div>
                        </div>

                        <!-- SECTION 5: Format & Quality -->
                        <div class="accordion-item">
                            <button class="accordion-header" aria-expanded="false"
                                data-i18n="resizeImages.format-quality">
                                🎨 Format & Quality
                            </button>
                            <div class="accordion-content">
                                <!-- Output Format -->
                                <div class="option-group">
                                    <label for="output-format" data-i18n="resizeImages.output-format">Output
                                        Format</label>
                                    <select id="output-format">
                                        <option value="jpeg">JPEG (Lossy)</option>
                                        <option value="png">PNG (Lossless)</option>
                                        <option value="webp">WebP (Modern)</option>
                                        <option value="bmp">BMP (Uncompressed)</option>
                                    </select>
                                </div>

                                <!-- Quality/Compression -->
                                <div class="option-group" id="quality-group">
                                    <label for="quality-slider">
                                        <span data-i18n="resizeImages.quality">Quality:</span>
                                        <span id="quality-value">85</span>%
                                    </label>
                                    <input type="range" id="quality-slider" min="1" max="100" value="85">
                                </div>

                                <!-- DPI -->
                                <div class="option-group">
                                    <label for="dpi-select" data-i18n="resizeImages.dpi">DPI (Print Resolution)</label>
                                    <select id="dpi-select">
                                        <option value="72">72 DPI (Screen)</option>
                                        <option value="96">96 DPI (Web)</option>
                                        <option value="150">150 DPI (Draft Print)</option>
                                        <option value="300" selected>300 DPI (Print Quality)</option>
                                    </select>
                                </div>

                                <!-- Strip Metadata -->
                                <div class="option-group">
                                    <label class="checkbox-label">
                                        <input type="checkbox" id="strip-metadata" checked>
                                        <span data-i18n="resizeImages.strip-metadata">🔐 Strip EXIF & Metadata
                                            (Privacy)</span>
                                    </label>
                                </div>
                            </div>
                        </div>

                        <!-- SECTION 6: Watermark -->
                        <div class="accordion-item">
                            <button class="accordion-header" aria-expanded="false" data-i18n="resizeImages.watermark">
                                💧 Watermark (Optional)
                            </button>
                            <div class="accordion-content">
                                <div class="option-group">
                                    <label class="checkbox-label">
                                        <input type="checkbox" id="enable-watermark">
                                        <span data-i18n="resizeImages.enable-watermark">Enable Watermark</span>
                                    </label>
                                </div>

                                <div id="watermark-options" style="display: none;">
                                    <!-- Watermark Type -->
                                    <div class="option-group">
                                        <div class="radio-group">
                                            <label>
                                                <input type="radio" name="watermark-type" value="text" checked>
                                                <span data-i18n="resizeImages.watermark-text">Text</span>
                                            </label>
                                            <label>
                                                <input type="radio" name="watermark-type" value="image">
                                                <span data-i18n="resizeImages.watermark-image">Image</span>
                                            </label>
                                        </div>
                                    </div>

                                    <!-- Text Watermark -->
                                    <div id="text-watermark-options">
                                        <div class="option-group">
                                            <label for="watermark-text"
                                                data-i18n="resizeImages.watermark-text-input">Text</label>
                                            <input type="text" id="watermark-text" placeholder="© 2025 Your Name">
                                        </div>

                                        <div class="option-group">
                                            <label for="watermark-font-size"
                                                data-i18n="resizeImages.watermark-size">Font Size</label>
                                            <input type="number" id="watermark-font-size" value="24" min="8" max="100">
                                        </div>

                                        <div class="option-group">
                                            <label for="watermark-opacity">
                                                <span data-i18n="resizeImages.watermark-opacity">Opacity:</span>
                                                <span id="watermark-opacity-value">50</span>%
                                            </label>
                                            <input type="range" id="watermark-opacity" min="0" max="100" value="50">
                                        </div>
                                    </div>

                                    <!-- Position -->
                                    <div class="option-group">
                                        <label data-i18n="resizeImages.watermark-position">Position</label>
                                        <div class="watermark-positions" role="group" aria-label="Watermark position">
                                            <button class="position-btn" data-position="top-left"
                                                aria-label="Top left">↖️</button>
                                            <button class="position-btn" data-position="top-center"
                                                aria-label="Top center">⬆️</button>
                                            <button class="position-btn" data-position="top-right"
                                                aria-label="Top right">↗️</button>
                                            <button class="position-btn" data-position="left"
                                                aria-label="Middle left">⬅️</button>
                                            <button class="position-btn active" data-position="center"
                                                aria-label="Center">⭕</button>
                                            <button class="position-btn" data-position="right"
                                                aria-label="Middle right">➡️</button>
                                            <button class="position-btn" data-position="bottom-left"
                                                aria-label="Bottom left">↙️</button>
                                            <button class="position-btn" data-position="bottom-center"
                                                aria-label="Bottom center">⬇️</button>
                                            <button class="position-btn" data-position="bottom-right"
                                                aria-label="Bottom right">↘️</button>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <!-- SECTION 7: Batch Properties -->
                        <div class="accordion-item">
                            <button class="accordion-header" aria-expanded="false" data-i18n="resizeImages.batch-props">
                                📦 Batch Properties
                            </button>
                            <div class="accordion-content">
                                <!-- File Naming -->
                                <div class="option-group">
                                    <label for="naming-pattern" data-i18n="resizeImages.naming-pattern">Filename
                                        Pattern</label>
                                    <select id="naming-pattern">
                                        <option value="original">Keep Original Name</option>
                                        <option value="original_resized">filename_resized</option>
                                        <option value="original_wxh">filename_800x600</option>
                                        <option value="custom">Custom Pattern...</option>
                                    </select>
                                </div>

                                <!-- Custom Prefix/Suffix -->
                                <div class="option-group">
                                    <label for="filename-prefix" data-i18n="resizeImages.prefix">Prefix</label>
                                    <input type="text" id="filename-prefix" placeholder="e.g., resized_">
                                </div>

                                <div class="option-group">
                                    <label for="filename-suffix" data-i18n="resizeImages.suffix">Suffix</label>
                                    <input type="text" id="filename-suffix" placeholder="e.g., _optimized">
                                </div>

                                <!-- Organize by size -->
                                <div class="option-group">
                                    <label class="checkbox-label">
                                        <input type="checkbox" id="organize-by-size">
                                        <span data-i18n="resizeImages.organize-by-size">📁 Organize into folders by
                                            size</span>
                                    </label>
                                </div>
                            </div>
                        </div>

                        <!-- SECTION 8: Presets -->
                        <div class="accordion-item">
                            <button class="accordion-header" aria-expanded="false" data-i18n="resizeImages.presets">
                                ⭐ Presets
                            </button>
                            <div class="accordion-content">
                                <div class="option-group">
                                    <label data-i18n="resizeImages.quick-presets">Quick Presets</label>
                                    <div class="button-group">
                                        <button class="quick-preset-btn"
                                            data-preset="thumbnail">Thumbnail<br><small>150×150</small></button>
                                        <button class="quick-preset-btn"
                                            data-preset="web">Web<br><small>1920×1080</small></button>
                                        <button class="quick-preset-btn"
                                            data-preset="print">Print<br><small>4000×3000</small></button>
                                        <button class="quick-preset-btn"
                                            data-preset="mobile">Mobile<br><small>640×480</small></button>
                                    </div>
                                </div>

                                <div class="option-group">
                                    <label data-i18n="resizeImages.social-presets">Social Media</label>
                                    <div class="button-group">
                                        <button class="social-preset-btn" data-preset="instagram-square">IG
                                            Square<br><small>1080×1080</small></button>
                                        <button class="social-preset-btn" data-preset="instagram-story">IG
                                            Story<br><small>1080×1920</small></button>
                                        <button class="social-preset-btn"
                                            data-preset="twitter">Twitter<br><small>1024×512</small></button>
                                        <button class="social-preset-btn"
                                            data-preset="facebook">Facebook<br><small>1200×628</small></button>
                                    </div>
                                </div>

                                <div class="option-group">
                                    <label for="preset-name" data-i18n="resizeImages.save-preset">Save Current as
                                        Preset</label>
                                    <div class="input-with-btn">
                                        <input type="text" id="preset-name" placeholder="My Custom Preset">
                                        <button id="save-preset-btn" class="secondary-btn"
                                            data-i18n="resizeImages.save-btn">Save</button>
                                    </div>
                                </div>

                                <div id="custom-presets-list" style="display: none;">
                                    <label data-i18n="resizeImages.custom-presets">Your Presets</label>
                                    <div id="custom-presets" class="custom-presets-grid"></div>
                                </div>
                            </div>
                        </div>

                        <!-- SECTION 9: Advanced Options -->
                        <div class="accordion-item">
                            <button class="accordion-header" aria-expanded="false" data-i18n="resizeImages.advanced">
                                ⚡ Advanced Options
                            </button>
                            <div class="accordion-content">
                                <!-- Smart Compression -->
                                <div class="option-group">
                                    <label class="checkbox-label">
                                        <input type="checkbox" id="smart-compression">
                                        <span data-i18n="resizeImages.smart-compression">🧠 Smart Compression (Auto
                                            Quality)</span>
                                    </label>
                                </div>

                                <!-- Target File Size -->
                                <div class="option-group" id="target-size-group" style="display: none;">
                                    <label for="target-file-size" data-i18n="resizeImages.target-size">Target File Size
                                        (KB)</label>
                                    <input type="number" id="target-file-size" value="500" min="10" max="10000">
                                </div>

                                <!-- Generate Thumbnails -->
                                <div class="option-group">
                                    <label class="checkbox-label">
                                        <input type="checkbox" id="generate-thumbnails">
                                        <span data-i18n="resizeImages.generate-thumbnails">📸 Generate Thumbnails
                                            (150×150)</span>
                                    </label>
                                </div>

                                <!-- Generate @2x Retina -->
                                <div class="option-group">
                                    <label class="checkbox-label">
                                        <input type="checkbox" id="generate-retina">
                                        <span data-i18n="resizeImages.generate-retina">🔍 Generate @2x Retina
                                            Versions</span>
                                    </label>
                                </div>

                                <!-- Create Responsive Set -->
                                <div class="option-group">
                                    <label class="checkbox-label">
                                        <input type="checkbox" id="generate-responsive">
                                        <span data-i18n="resizeImages.generate-responsive">📱 Generate Responsive Set (3
                                            sizes)</span>
                                    </label>
                                </div>
                            </div>
                        </div>

                    </div><!-- /options-accordion -->

                    <!-- Action Buttons -->
                    <div class="action-buttons">
                        <button id="reset-btn" class="secondary-btn" data-i18n="resizeImages.reset-btn">↻ Reset</button>
                        <button id="process-btn" class="primary-btn" data-i18n="resizeImages.process-btn">⚙️ Process
                            All</button>
                    </div>
                </div><!-- /options-panel -->
            </div><!-- /resize-wrapper -->

            <!-- History/Results Panel -->
            <div class="results-section" id="results-section" style="display: none;">
                <div class="results-header">
                    <h3 data-i18n="resizeImages.results">Results</h3>
                    <button id="download-all-btn" class="primary-btn" data-i18n="resizeImages.download-all">⬇️ Download
                        All as ZIP</button>
                </div>
                <div id="results-grid" class="results-grid"></div>
            </div>
        </main>
    </div>

    <!-- Loading Modal -->
    <div id="loading-modal" class="modal" role="dialog" aria-modal="true" aria-label="Processing"
        style="display: none;">
        <div class="modal-content">
            <div class="spinner" aria-hidden="true"></div>
            <p id="loading-text" data-i18n="resizeImages.processing">Processing...</p>
        </div>
    </div>

    <!-- Message Modal -->
    <div id="message-modal" class="modal" role="dialog" aria-modal="true">
        <div class="modal-content">
            <span class="close-btn" role="button" tabindex="0" aria-label="Close">&times;</span>
            <h2 id="modal-title"></h2>
            <p id="modal-message"></p>
            <button id="modal-close-btn" class="primary-btn">OK</button>
        </div>
    </div>

    <script type="module" src="./editImages.js"></script>
</body>

</html>
