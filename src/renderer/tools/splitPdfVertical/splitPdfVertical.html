<!-- src/renderer/tools/splitPdfVertical/splitPdfVertical.html -->

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LocalPDF Studio - Split PDF (Vertical)</title>
    <meta http-equiv="Content-Security-Policy" content="
    default-src 'self';
    script-src 'self';
    style-src 'self' 'unsafe-inline';
    img-src 'self' data:;
    connect-src 'self' http://localhost:*;">
    <link rel="stylesheet" href="../../styles/main.css">
    <link rel="stylesheet" href="./splitPdfVertical.css">
    <link rel="stylesheet" href="../../styles/loading.css">
    <script type="module" src="../../utils/themeManager.js"></script>
</head>

<body>
    <div id="app">
        <div class="top-bar">
            <a href="../../index.html" class="top-btn" data-i18n="common.back-btn">← Back</a>
            <h1 class="tool-title" data-i18n="splitPdfVertical.tool-title">Split PDF (Vertical)</h1>
        </div>
        <main class="tool-container">

            <!-- File Selection -->
            <div class="file-selection-area">
                <button id="select-pdf-btn" class="select-pdf-btn">
                    <span data-i18n="common.btn-select">Click to Select a PDF File or drop PDF here</span>
                    <p><small class="select-hint" data-i18n="common.supported-formats">Supports PDF</small></p>
                </button>
                <div id="selected-file-info" class="selected-file-info" style="display: none;">
                    <div style="flex-grow: 1;">
                        <p id="pdf-name" class="pdf-name"></p>
                        <p id="pdf-size" class="pdf-size"></p>
                    </div>
                    <button id="remove-pdf-btn" class="remove-btn">
                        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-x-icon lucide-x"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
                    </button>
                </div>
            </div>

            <!-- PDF Preview -->
            <div id="preview-container" class="preview-container" style="display: none;">
                <div class="preview-header">
                    <h3 data-i18n="splitPdfVertical.pdf-preview">PDF Preview</h3>
                    <span id="page-count" class="page-count"></span>
                </div>
                <div id="preview-grid" class="preview-grid"></div>
            </div>

            <!-- Split Options -->
            <div class="split-options-container">
                <h2 data-i18n="splitPdfVertical.split-options">Split Options</h2>

                <!-- 50/50 -->
                <div class="split-method">
                    <input type="radio" id="splitEvenHalf" name="splitMode" value="half" checked>
                    <label for="splitEvenHalf" data-i18n="splitPdfVertical.split-option1">Split evenly (50 / 50)</label>
                </div>
                <div class="options-panel" id="optionsHalf" style="border: none; padding-left: 2rem;">
                    <small class="help-text" data-i18n="splitPdfVertical.split-option1-helpTxt">Each page will be split exactly down the middle into a left and right
                        PDF.</small>
                </div>

                <!-- Custom % -->
                <div class="split-method">
                    <input type="radio" id="splitCustom" name="splitMode" value="custom">
                    <label for="splitCustom" data-i18n="splitPdfVertical.split-option2">Custom split position</label>
                </div>
                <div class="options-panel" id="optionsCustom" style="display: none;">
                    <label
                        style="color: var(--options-label-color); font-size: 0.9rem; display: block; margin-bottom: 0.6rem;"
                        data-i18n="splitPdfVertical.split-option2-instruction">
                        Split position (% from left edge)
                    </label>
                    <div class="slider-row">
                        <input type="range" id="split-slider" class="split-slider" min="1" max="99" value="50">
                        <input type="number" id="split-percentage" class="percentage-input" min="1" max="99" value="50">
                        <span class="percentage-symbol">%</span>
                    </div>

                    <!-- Visual bar preview -->
                    <div class="split-visual-preview">
                        <div class="split-visual-left" id="visual-left" style="width: 50%;">
                            <span class="split-visual-label" id="label-left">Left — 50%</span>
                        </div>
                        <div class="split-visual-line"></div>
                        <div class="split-visual-right" id="visual-right">
                            <span class="split-visual-label" id="label-right">Right — 50%</span>
                        </div>
                    </div>
                    <small class="help-text" style="margin-top: 0.5rem;" data-i18n="splitPdfVertical.split-option2-helpTxt">
                        Drag the slider or type a value between 1 and 99.
                    </small>
                </div>
            </div>

            <!-- Action -->
            <div class="action-buttons">
                <button id="split-btn" class="top-btn" data-i18n="splitPdfVertical.split-btn" disabled>Split PDF (Vertical)</button>
            </div>

        </main>
    </div>

    <script type="module" src="./splitPdfVertical.js"></script>
</body>

</html>
