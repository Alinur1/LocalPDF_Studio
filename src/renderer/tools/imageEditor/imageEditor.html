<!-- src/renderer/tools/imageEditor/imageEditor.html -->

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LocalPDF Studio - Image Editor</title>
    <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self' http://localhost:*;">
    <link rel="stylesheet" href="../../styles/main.css">
    <link rel="stylesheet" href="./imageEditor.css">
    <script type="module" src="../../utils/themeManager.js"></script>
</head>

<body>
    <div id="app">
        <div class="top-bar">
            <a href="../../index.html" class="top-btn" id="back-btn">← Back</a>
            <h1 class="tool-title">Image Editor</h1>
        </div>

        <main class="tool-container">

            <!-- File Selection -->
            <div class="file-selection-area" id="file-selection-area">
                <button id="select-image-btn" class="select-pdf-btn">
                    <span class="select-icon">🖼️</span>
                    <span>Click to Select an Image or Drop it Here</span>
                    <p><small class="select-hint">Supports JPG, PNG, BMP, TIFF, WebP</small></p>
                </button>
                <div id="selected-file-info" class="selected-file-info" style="display: none;">
                    <div style="flex-grow: 1;">
                        <p id="image-name" class="pdf-name"></p>
                        <p id="image-size" class="pdf-size"></p>
                    </div>
                    <button id="remove-image-btn" class="remove-btn" title="Remove image">×</button>
                </div>
            </div>

            <!-- Editor Workspace -->
            <div id="editor-workspace" class="editor-workspace" style="display: none;">

                <!-- Canvas Area -->
                <div class="canvas-panel">
                    <div class="canvas-header">
                        <span class="canvas-label">Preview</span>
                        <div class="canvas-info">
                            <span id="canvas-dimensions" class="canvas-dimensions"></span>
                            <button id="reset-btn" class="icon-btn reset-btn" title="Reset all edits">↺ Reset</button>
                        </div>
                    </div>
                    <div class="canvas-wrapper" id="canvas-wrapper">
                        <canvas id="editor-canvas"></canvas>
                        <!-- Crop overlay drawn on top -->
                        <canvas id="crop-overlay" style="display: none;"></canvas>
                    </div>
                </div>

                <!-- Tools Panel -->
                <div class="tools-panel">

                    <!-- Tab Nav -->
                    <div class="tool-tabs">
                        <button class="tab-btn active" data-tab="adjustments">🎨 Adjust</button>
                        <button class="tab-btn" data-tab="transform">🔄 Transform</button>
                        <button class="tab-btn" data-tab="filters">✨ Filters</button>
                        <button class="tab-btn" data-tab="text">📝 Text</button>
                        <button class="tab-btn" data-tab="crop">✂️ Crop</button>
                    </div>

                    <!-- Adjustments Tab -->
                    <div class="tab-content active" id="tab-adjustments">
                        <div class="option-group">
                            <label>Brightness</label>
                            <div class="range-input-group">
                                <input type="range" id="brightness" class="range-input" min="-100" max="100" value="0">
                                <span class="range-value" id="brightness-value">0</span>
                            </div>
                        </div>
                        <div class="option-group">
                            <label>Contrast</label>
                            <div class="range-input-group">
                                <input type="range" id="contrast" class="range-input" min="-100" max="100" value="0">
                                <span class="range-value" id="contrast-value">0</span>
                            </div>
                        </div>
                        <div class="option-group">
                            <label>Saturation</label>
                            <div class="range-input-group">
                                <input type="range" id="saturation" class="range-input" min="-100" max="100" value="0">
                                <span class="range-value" id="saturation-value">0</span>
                            </div>
                        </div>
                        <div class="option-group">
                            <label>Exposure</label>
                            <div class="range-input-group">
                                <input type="range" id="exposure" class="range-input" min="-100" max="100" value="0">
                                <span class="range-value" id="exposure-value">0</span>
                            </div>
                        </div>
                        <div class="option-group">
                            <label>Sharpness</label>
                            <div class="range-input-group">
                                <input type="range" id="sharpness" class="range-input" min="0" max="10" value="0">
                                <span class="range-value" id="sharpness-value">0</span>
                            </div>
                        </div>
                        <div class="option-group">
                            <label>Blur</label>
                            <div class="range-input-group">
                                <input type="range" id="blur" class="range-input" min="0" max="20" value="0">
                                <span class="range-value" id="blur-value">0</span>
                            </div>
                        </div>
                        <div class="option-group">
                            <label>Opacity</label>
                            <div class="range-input-group">
                                <input type="range" id="opacity-adj" class="range-input" min="0" max="100" value="100">
                                <span class="range-value" id="opacity-value">100%</span>
                            </div>
                        </div>
                    </div>

                    <!-- Transform Tab -->
                    <div class="tab-content" id="tab-transform">
                        <div class="option-group">
                            <label>Rotate</label>
                            <div class="btn-row">
                                <button class="action-pill" id="rotate-ccw">↺ 90° CCW</button>
                                <button class="action-pill" id="rotate-cw">↻ 90° CW</button>
                            </div>
                        </div>
                        <div class="option-group">
                            <label>Flip</label>
                            <div class="btn-row">
                                <button class="action-pill" id="flip-h">↔ Horizontal</button>
                                <button class="action-pill" id="flip-v">↕ Vertical</button>
                            </div>
                        </div>
                        <div class="option-group">
                            <label>Fine Rotation (°)</label>
                            <div class="range-input-group">
                                <input type="range" id="fine-rotation" class="range-input" min="-45" max="45" value="0">
                                <span class="range-value" id="fine-rotation-value">0°</span>
                            </div>
                        </div>
                        <div class="option-group">
                            <label>Resize</label>
                            <div class="resize-grid">
                                <div class="resize-field">
                                    <label class="sub-label">Width (px)</label>
                                    <input type="number" id="resize-width" class="options-input" min="1" max="10000">
                                </div>
                                <div class="resize-field">
                                    <label class="sub-label">Height (px)</label>
                                    <input type="number" id="resize-height" class="options-input" min="1" max="10000">
                                </div>
                            </div>
                            <div class="checkbox-group" style="margin-top: 0.5rem;">
                                <input type="checkbox" id="lock-aspect" checked>
                                <label for="lock-aspect">Lock aspect ratio</label>
                            </div>
                            <button class="action-pill full-width" id="apply-resize" style="margin-top: 0.7rem;">Apply
                                Resize</button>
                        </div>
                    </div>

                    <!-- Filters Tab -->
                    <div class="tab-content" id="tab-filters">
                        <p class="help-text" style="margin-bottom: 1rem;">Click a filter to apply it. Click again to
                            remove.</p>
                        <div class="filter-grid" id="filter-grid">
                            <button class="filter-btn active" data-filter="none">
                                <span class="filter-preview-label">Original</span>
                            </button>
                            <button class="filter-btn" data-filter="grayscale">
                                <span class="filter-preview-label">Grayscale</span>
                            </button>
                            <button class="filter-btn" data-filter="sepia">
                                <span class="filter-preview-label">Sepia</span>
                            </button>
                            <button class="filter-btn" data-filter="invert">
                                <span class="filter-preview-label">Invert</span>
                            </button>
                            <button class="filter-btn" data-filter="vintage">
                                <span class="filter-preview-label">Vintage</span>
                            </button>
                            <button class="filter-btn" data-filter="cool">
                                <span class="filter-preview-label">Cool</span>
                            </button>
                            <button class="filter-btn" data-filter="warm">
                                <span class="filter-preview-label">Warm</span>
                            </button>
                            <button class="filter-btn" data-filter="dramatic">
                                <span class="filter-preview-label">Dramatic</span>
                            </button>
                        </div>
                    </div>

                    <!-- Text Overlay Tab -->
                    <div class="tab-content" id="tab-text">
                        <div class="option-group">
                            <label>Text Content</label>
                            <textarea id="text-content" class="options-textarea"
                                placeholder="Enter text to overlay..."></textarea>
                        </div>
                        <div class="option-group">
                            <label>Font Size</label>
                            <div class="range-input-group">
                                <input type="range" id="text-size" class="range-input" min="8" max="120" value="32">
                                <span class="range-value" id="text-size-value">32px</span>
                            </div>
                        </div>
                        <div class="option-group">
                            <label>Text Color</label>
                            <div class="color-input-group">
                                <input type="color" id="text-color" class="color-input" value="#ffffff">
                                <div id="text-color-preview" class="color-preview" style="background-color: #ffffff;">
                                </div>
                            </div>
                        </div>
                        <div class="option-group">
                            <label>Font Weight</label>
                            <select id="text-weight" class="options-select">
                                <option value="normal">Normal</option>
                                <option value="bold" selected>Bold</option>
                            </select>
                        </div>
                        <div class="option-group">
                            <label>Position</label>
                            <div class="position-grid">
                                <button class="pos-btn" data-pos="top-left">↖</button>
                                <button class="pos-btn" data-pos="top-center">↑</button>
                                <button class="pos-btn" data-pos="top-right">↗</button>
                                <button class="pos-btn" data-pos="middle-left">←</button>
                                <button class="pos-btn active" data-pos="center">●</button>
                                <button class="pos-btn" data-pos="middle-right">→</button>
                                <button class="pos-btn" data-pos="bottom-left">↙</button>
                                <button class="pos-btn" data-pos="bottom-center">↓</button>
                                <button class="pos-btn" data-pos="bottom-right">↘</button>
                            </div>
                        </div>
                        <div class="option-group">
                            <label>Background</label>
                            <div class="checkbox-group">
                                <input type="checkbox" id="text-bg">
                                <label for="text-bg">Add dark background behind text</label>
                            </div>
                        </div>
                        <button class="action-pill full-width" id="apply-text">Apply Text Overlay</button>
                        <button class="action-pill full-width danger" id="clear-text" style="margin-top:0.5rem;">Clear
                            Text Overlay</button>
                    </div>

                    <!-- Crop Tab -->
                    <div class="tab-content" id="tab-crop">
                        <p class="help-text" style="margin-bottom: 0.8rem;">Draw a selection on the image to crop it.
                        </p>
                        <div class="option-group">
                            <label>Aspect Ratio</label>
                            <select id="crop-ratio" class="options-select">
                                <option value="free">Free</option>
                                <option value="1:1">1:1 (Square)</option>
                                <option value="4:3">4:3</option>
                                <option value="16:9">16:9 (Widescreen)</option>
                                <option value="3:2">3:2</option>
                                <option value="2:3">2:3 (Portrait)</option>
                            </select>
                        </div>
                        <button class="action-pill full-width" id="start-crop">Start Crop Selection</button>
                        <button class="action-pill full-width" id="apply-crop" style="margin-top: 0.5rem;"
                            disabled>Apply Crop</button>
                        <button class="action-pill full-width danger" id="cancel-crop" style="margin-top: 0.5rem;"
                            disabled>Cancel</button>
                        <div id="crop-coords" class="crop-coords" style="display:none;">
                            <span id="crop-info"></span>
                        </div>
                    </div>

                </div>
            </div>

            <!-- Action Buttons -->
            <div class="action-buttons" id="action-buttons" style="display: none;">
                <select id="save-format" class="options-select format-select">
                    <option value="image/png">PNG</option>
                    <option value="image/jpeg">JPEG</option>
                    <option value="image/webp">WebP</option>
                </select>
                <button id="save-btn" class="top-btn">💾 Save Image</button>
            </div>

        </main>
    </div>

    <script type="module" src="./imageEditor.js"></script>
</body>

</html>
