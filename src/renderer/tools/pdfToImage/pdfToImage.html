<!-- src/renderer/tools/pdfToImage/pdfToImage.html -->

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LocalPDF Studio - PDF to Image</title>
    <meta http-equiv="Content-Security-Policy" content="
    default-src 'self';
    script-src 'self';
    style-src 'self' 'unsafe-inline';
    img-src 'self' data:;
    connect-src 'self' http://localhost:*;">
    <link rel="stylesheet" href="../../styles/main.css">
    <link rel="stylesheet" href="./pdfToImage.css">
    <script type="module" src="../../utils/themeManager.js"></script>
</head>
<body>
    <div id="app">
        <div class="top-bar">
            <a href="../../index.html" class="top-btn" data-i18n="common.back-btn">← Back</a>
            <h1 class="tool-title" data-i18n="pdftoImg.page-title">PDF to Image</h1>
        </div>
        <main class="tool-container">
            <div class="file-selection-area">
                <button id="select-pdf-btn" class="select-pdf-btn">
                    <span data-i18n="common.btn-select">Click to Select a PDF File or drop PDF here</span>
                    <p><small class="select-hint" data-i18n="common.supported-formats">Supports PDF</small></p>
                </button>
                <div id="selected-file-info" class="selected-file-info" style="display: none;">
                    <div style="flex-grow: 1;">
                        <p id="pdf-name" class="pdf-name"></p>
                        <p id="pdf-size" class="pdf-size"></p>
                    </div>
                    <button id="remove-pdf-btn" class="remove-btn">
                        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-x-icon lucide-x"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
                    </button>
                </div>
            </div>
            <div id="preview-container" class="preview-container" style="display: none;">
                <div class="preview-header">
                    <h3 data-i18n="pdftoImg.preview-title">PDF Preview</h3>
                    <span id="page-count" class="page-count"></span>
                </div>
                <div id="preview-grid" class="preview-grid">
                </div>
            </div>
            <div class="conversion-options-container">
                <h2 data-i18n="pdftoImg.conversion-options-title">Conversion Options</h2>
                <div class="option-group">
                    <label for="imageQuality" data-i18n="pdftoImg.image-quality-label">Image Quality:</label>
                    <select id="imageQuality" class="options-select">
                        <option value="72" data-i18n="pdftoImg.quality-low">Low (72 DPI) - Smaller file size</option>
                        <option value="150" data-i18n="pdftoImg.quality-medium" selected>Medium (150 DPI) - Balanced</option>
                        <option value="300" data-i18n="pdftoImg.quality-high">High (300 DPI) - Best quality</option>
                    </select>
                    <small class="help-text" data-i18n="pdftoImg.quality-help">Higher DPI = Better quality but larger file sizes</small>
                </div>
                <div class="option-group">
                    <label for="imageFormat" data-i18n="pdftoImg.image-format-label">Output Format:</label>
                    <select id="imageFormat" class="options-select">
                        <option value="jpg" data-i18n="pdftoImg.format-jpg" selected>JPG (Smaller size, good for photos)</option>
                        <option value="png" data-i18n="pdftoImg.format-png">PNG (Larger size, lossless quality)</option>
                    </select>
                    <small class="help-text" data-i18n="pdftoImg.format-help">All images will be saved as a ZIP file</small>
                </div>
                <div class="option-group">
                    <label>
                        <input type="checkbox" id="includePageNumbers" checked>
                        <span data-i18n="pdftoImg.include-page-numbers">Include page numbers in filenames</span>
                    </label>
                    <small class="help-text" data-i18n="pdftoImg.page-number-example">e.g., document_page_001.jpg, document_page_002.jpg</small>
                </div>
            </div>
            <div class="action-buttons">
                <button id="convert-btn" class="top-btn" data-i18n="pdftoImg.convert-to-image" disabled>Convert to Image</button>
            </div>
        </main>
    </div>

    <script type="module" src="./pdfToImage.js"></script>
</body>

</html>
